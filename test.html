<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Form - Xntrova Lead Submission</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #0b1329; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
        .card { background: #151f38; border: 1px solid #2a3958; border-radius: 12px; padding: 2rem; max-width: 480px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #cbd5e1; }
        input, select, textarea { width: 100%; padding: 0.7rem 0.9rem; background: #0b1329; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 0.85rem; background: #059669; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
        button:hover { background: #047857; }
        .result { margin-top: 1rem; padding: 0.8rem; border-radius: 6px; display: none; font-size: 0.9rem; }
        .result.success { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; display: block; }
        .result.error { background: #4c0519; color: #fda4af; border: 1px solid #e11d48; display: block; }
        .view-link { display: inline-block; margin-top: 1rem; color: #38bdf8; font-size: 0.9rem; text-decoration: none; }
        .view-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h2>🧪 Direct Form Test</h2>
    <p>Yahan detail fill karke <b>Submit</b> karein, data turant SQL database me save hoga:</p>

    <div id="resultBox" class="result"></div>

    <form id="leadForm">
        <div class="form-group">
            <label>Name *</label>
            <input type="text" name="name" id="name" placeholder="Aapka Naam" required value="Test Lead User">
        </div>
        <div class="form-group">
            <label>Phone / WhatsApp *</label>
            <input type="tel" name="phone" id="phone" placeholder="+91 9876543210" required value="+91 9876500000">
        </div>
        <div class="form-group">
            <label>Service</label>
            <select name="service" id="service">
                <option value="SEO (Search Engine Optimisation)">SEO (Search Engine Optimisation)</option>
                <option value="Performance Marketing (PPC & Meta Ads)">Performance Marketing</option>
                <option value="Web & App Development">Web & App Development</option>
                <option value="Social Media Marketing">Social Media Marketing</option>
            </select>
        </div>
        <div class="form-group">
            <label>Message / Goals</label>
            <textarea name="message" id="message" rows="2" placeholder="Tell us about your business goals">Direct form test submission</textarea>
        </div>
        <button type="submit" id="submitBtn">Send / Submit</button>
    </form>

    <a href="http://localhost/xntrova/view_leads.php" target="_blank" class="view-link">
        👉 Click here to View All Saved Leads (view_leads.php)
    </a>
</div>

<script>
document.getElementById('leadForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const resultBox = document.getElementById('resultBox');
    
    btn.disabled = true;
    btn.innerText = "Saving to Database...";
    resultBox.className = "result";
    resultBox.style.display = "none";

    const payload = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        service: document.getElementById('service').value,
        message: document.getElementById('message').value
    };

    try {
        const response = await fetch('http://localhost/xntrova/submit_form.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.status === 'success') {
            resultBox.className = "result success";
            resultBox.innerHTML = "✅ <b>Success!</b> Detail database me save ho gayi! (Lead ID: #" + data.lead_id + ")<br><br><a href='http://localhost/xntrova/view_leads.php' style='color:#fff; text-decoration:underline;' target='_blank'>Yahan Click karke SQL data dekhein</a>";
            resultBox.style.display = "block";
        } else {
            resultBox.className = "result error";
            resultBox.innerHTML = "❌ Error: " + (data.message || JSON.stringify(data.errors));
            resultBox.style.display = "block";
        }
    } catch (err) {
        resultBox.className = "result error";
        resultBox.innerHTML = "❌ Connection Failed: " + err.message;
        resultBox.style.display = "block";
    } finally {
        btn.disabled = false;
        btn.innerText = "Send / Submit";
    }
});
</script>
</body>
</html>
